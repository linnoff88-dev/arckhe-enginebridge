[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ARCKHÉ-enginebridge"
version = "1.0.0"
description = "Local policy and subscription CLI adapters for model routing"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6.0,<7"]

[project.scripts]
enginebridge = "enginebridge.cli:main"

[tool.setuptools.packages.find]
include = ["enginebridge*"]
